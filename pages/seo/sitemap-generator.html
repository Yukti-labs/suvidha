<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sitemap Generator — Suvidha Tools</title>
<script type="module" src="../../assets/js/shared-ui-new.js"></script>
<style>
  .container { max-width: 800px; margin: 30px auto; padding: 20px; }
  textarea { width: 100%; height: 180px; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-family: monospace; }
  .row { display: flex; gap: 15px; margin-top: 15px; align-items: end; }
  button { padding: 10px 15px; background: var(--accent); color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  button:hover { opacity: 0.9; }
  .output { margin-top: 20px; padding: 15px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; white-space: pre-wrap; font-family: monospace; max-height: 400px; overflow: auto; }
  .copyBtn { margin-top: 10px; padding: 8px 12px; background: var(--accent2); color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  .copyBtn:hover { opacity: 0.9; }
  .hint { font-size: 0.9em; color: var(--muted); margin-top: 5px; }
</style>
</head>
<body>
<div class="container">
<h1>Sitemap Generator</h1>
<p>Create XML sitemaps from a list of URLs or crawl a simple site map.</p>
<textarea id="urlsInput" placeholder="Enter one URL per line&#10;https://example.com/&#10;https://example.com/about&#10;https://example.com/contact"></textarea>
<div class="row">
  <label>
    <input type="checkbox" id="addLastmod">
    Include lastmod date (today)
  </label>
</div>
<div class="row">
  <button id="generateBtn">Generate Sitemap</button>
  <a href="#" id="downloadLink" style="display:none;" download="sitemap.xml">Download XML</a>
</div>
<div class="hint">Tip: Leave blank to use current page URL as single entry.</div>
<div class="output" id="output"></div>
<button id="copyBtn" style="display:none;">Copy to Clipboard</button>
</div>
<script>
const urlsInput = document.getElementById('urlsInput');
const addLastmod = document.getElementById('addLastmod');
const generateBtn = document.getElementById('generateBtn');
const outputDiv = document.getElementById('output');
const downloadLink = document.getElementById('downloadLink');
const copyBtn = document.getElementById('copyBtn');

function escapeXml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&apos;');
}

generateBtn.addEventListener('click', () => {
  const text = urlsInput.value.trim();
  let lines = text ? text.split('\n').map(l => l.trim()).filter(l => l.length > 0) : [window.location.href];
  if (lines.length === 0) lines = [window.location.href];

  const today = new Date().toISOString().slice(0,10);
  let xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
  xml += '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n';
  for (const url of lines) {
    xml += '  <url>\n';
    xml += `    <loc>${escapeXml(url)}</loc>\n`;
    if (addLastmod.checked) {
      xml += `    <lastmod>${today}</lastmod>\n`;
    }
    xml += '  </url>\n';
  }
  xml += '</urlset>';

  outputDiv.textContent = xml;
  const blob = new Blob([xml], {type: 'application/xml;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  downloadLink.href = url;
  downloadLink.style.display = 'inline-block';
  copyBtn.style.display = 'inline-block';
});

copyBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(outputDiv.textContent).then(() => {
    copyBtn.textContent = 'Copied!';
    setTimeout(() => { copyBtn.textContent = 'Copy to Clipboard'; }, 2000);
  });
});
</script>
</body>
</html>
