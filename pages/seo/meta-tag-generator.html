<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meta Tag Generator — Suvidha Tools</title>
<script type="module" src="../../assets/js/shared-ui.js"></script>
<style>
  .container { max-width: 800px; margin: 30px auto; padding: 20px; }
  .row { display: flex; gap: 15px; margin-bottom: 15px; }
  .row > div { flex: 1; }
  label { display: block; margin-bottom: 5px; font-weight: 600; }
  input, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface2); color: var(--text); }
  textarea { height: 80px; resize: vertical; }
  button { margin-top: 10px; padding: 10px 15px; background: var(--accent); color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  button:hover { opacity: 0.9; }
  .output { margin-top: 20px; padding: 15px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; white-space: pre-wrap; font-family: monospace; }
  .copyBtn { margin-top: 10px; padding: 8px 12px; background: var(--accent2); color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  .copyBtn:hover { opacity: 0.9; }
</style>
</head>
<body>
<div class="container">
<h1>Meta Tag Generator</h1>
<p>Generate HTML meta tags, Open Graph, and Twitter card snippets for any URL.</p>
<div class="row">
  <div>
    <label for="title">Title</label>
    <input type="text" id="title" placeholder="Page title">
  </div>
  <div>
    <label for="description">Description</label>
    <input type="text" id="description" placeholder="Page description">
  </div>
</div>
<div class="row">
  <div>
    <label for="keywords">Keywords (comma separated)</label>
    <input type="text" id="keywords" placeholder="keyword1, keyword2, keyword3">
  </div>
  <div>
    <label for="author">Author</label>
    <input type="text" id="author" placeholder="Author name">
  </div>
</div>
<div class="row">
  <div>
    <label for="ogImage">OG Image URL</label>
    <input type="text" id="ogImage" placeholder="https://example.com/image.jpg">
  </div>
  <div>
    <label for="twitterHandle">Twitter @handle</label>
    <input type="text" id="twitterHandle" placeholder="@username">
  </div>
</div>
<div class="row">
  <div>
    <label for="url">Canonical URL</label>
    <input type="text" id="url" placeholder="https://example.com/page">
  </div>.
</div>
<button id="generateBtn">Generate Meta Tags</button>
<div class="output" id="output"></div>
<button id="copyBtn" style="display:none;">Copy to Clipboard</button>
</div>
<script>
const titleIn = document.getElementById('title');
const descIn = document.getElementById('description');
const kwIn = document.getElementById('keywords');
const authorIn = document.getElementById('author');
const ogImgIn = document.getElementById('ogImage');
const twHandleIn = document.getElementById('twitterHandle');
const urlIn = document.getElementById('url');
const generateBtn = document.getElementById('generateBtn');
const outputDiv = document.getElementById('output');
const copyBtn = document.getElementById('copyBtn');

function escapeHtml(str) {
  return String(str).replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>').replace(/"/g, '"').replace(/'/g, '&#039;');
}

generateBtn.addEventListener('click', () => {
  const title = titleIn.value.trim();
  const description = descIn.value.trim();
  const keywords = kwIn.value.trim();
  const author = authorIn.value.trim();
  const ogImage = ogImgIn.value.trim();
  const twitterHandle = twHandleIn.value.trim();
  const url = urlIn.value.trim();

  let tags = '';
  if (title) tags += `<title>${escapeHtml(title)}</title>\n`;
  if (description) tags += `<meta name="description" content="${escapeHtml(description)}">\n`;
  if (keywords) tags += `<meta name="keywords" content="${escapeHtml(keywords)}">\n`;
  if (author) tags += `<meta name="author" content="${escapeHtml(author)}">\n`;
  tags += `<meta property="og:title" content="${escapeHtml(title)}">\n`;
  tags += `<meta property="og:description" content="${escapeHtml(description)}">\n`;
  if (ogImage) tags += `<meta property="og:image" content="${escapeHtml(ogImage)}">\n`;
  tags += `<meta property="og:url" content="${escapeHtml(url || window.location.href)}">\n`;
  tags += `<meta property="og:type" content="website">\n`;
  tags += `<meta name="twitter:card" content="summary_large_image">\n`;
  if (twitterHandle) tags += `<meta name="twitter:site" content="${escapeHtml(twitterHandle)}">\n`;
  tags += `<meta name="twitter:title" content="${escapeHtml(title)}">\n`;
  tags += `<meta name="twitter:description" content="${escapeHtml(description)}">\n`;
  if (ogImage) tags += `<meta name="twitter:image" content="${escapeHtml(ogImage)}">\n`;

  outputDiv.textContent = tags;
  copyBtn.style.display = 'inline-block';
});

copyBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(outputDiv.textContent).then(() => {
    copyBtn.textContent = 'Copied!';
    setTimeout(() => { copyBtn.textContent = 'Copy to Clipboard'; }, 2000);
  });
});
</script>
</body>
</html>
