<body>
<div class="content">
  <nav class="tool-breadcrumb" aria-label="Breadcrumb">
    <a href="../../index.html">Suvidha</a>
    <span class="crumb-sep">/</span>
    <a href="../../index.html#pdf-tools">PDF</a>
    <span class="crumb-sep">/</span>
    <span class="crumb-current">PDF Merger</span>
  </nav>

  <div class="header">
    <h1>PDF Merger</h1>
    <p class="sub">Combine multiple PDFs into one document with custom order. Processed entirely in your browser.</p>
  </div>
  <div class="card">
    <div class="drop-zone" id="dropZone">
      <input type="file" accept=".pdf" multiple id="fileInput">
      <div style="margin-bottom:10px;color:var(--accent)">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m8 6 4-4 4 4"/><path d="M12 2v10.3a4 4 0 0 1-1.172 2.872L4 22"/><path d="m20 22-5-5"/></svg>
      </div>
      <div class="drop-title">Drop PDFs here</div>
      <div class="drop-sub">or click to browse · select multiple files</div>
    </div>

    <div class="file-list" id="fileList"></div>
    <p class="hint" id="hint" style="display:none">Drag rows to reorder pages</p>
    <button class="btn" id="mergeBtn" disabled style="margin-top:16px">Merge PDFs</button>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-label" id="progressLabel">Merging…</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="status success" id="statusSuccess"><span>✓</span><span id="successMsg"></span></div>
    <div class="status error" id="statusError"><span>✕</span><span id="errorMsg"></span></div>
    <a class="dl-btn" id="dlBtn">Download Merged PDF</a>
    <button class="reset" id="resetBtn" style="display:none">Start over</button>
  </div>
</div>
<script>
const dropZone=document.getElementById('dropZone');
const fileInput=document.getElementById('fileInput');
const fileList=document.getElementById('fileList');
const hint=document.getElementById('hint');
const mergeBtn=document.getElementById('mergeBtn');
const progressWrap=document.getElementById('progressWrap');
const progressLabel=document.getElementById('progressLabel');
const progressFill=document.getElementById('progressFill');
const statusSuccess=document.getElementById('statusSuccess');
const statusError=document.getElementById('statusError');
const successMsg=document.getElementById('successMsg');
const errorMsg=document.getElementById('errorMsg');
const dlBtn=document.getElementById('dlBtn');
const resetBtn=document.getElementById('resetBtn');

let files=[];
let dragSrc=null;

function fmt(b){if(b<1024)return b+'B';if(b<1048576)return(b/1024).toFixed(1)+'KB';return(b/1048576).toFixed(2)+'MB'}
function hideStatus(){statusSuccess.classList.remove('visible');statusError.classList.remove('visible');dlBtn.classList.remove('visible');progressWrap.classList.remove('visible')}
function showError(m){hideStatus();errorMsg.textContent=m;statusError.classList.add('visible')}

function renderList(){
  fileList.innerHTML='';
  if(files.length===0){hint.style.display='none';mergeBtn.disabled=true;return}
  hint.style.display='block';
  mergeBtn.disabled=files.length<2;
  files.forEach((f,i)=>{
    const el=document.createElement('div');
    el.className='file-item';
    el.draggable=true;
    el.dataset.idx=i;
    el.innerHTML=`<span class="drag-handle">⠿</span><span class="file-name">${f.name}</span><span class="file-size">${fmt(f.size)}</span><button class="file-remove" data-i="${i}">✕</button>`;
    el.addEventListener('dragstart',e=>{dragSrc=i;el.classList.add('dragging');e.dataTransfer.effectAllowed='move'});
    el.addEventListener('dragend',()=>el.classList.remove('dragging'));
    el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drag-over')});
    el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));
    el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('drag-over');if(dragSrc===null||dragSrc===i)return;const moved=files.splice(dragSrc,1)[0];files.splice(i,0,moved);dragSrc=null;renderList()});
    el.querySelector('.file-remove').addEventListener('click',()=>{files.splice(i,1);renderList();hideStatus()});
    fileList.appendChild(el);
  });
}

function addFiles(newFiles){
  for(const f of newFiles){if(f.type==='application/pdf'||f.name.endsWith('.pdf'))files.push(f)}
  renderList();hideStatus();resetBtn.style.display='none';
}

fileInput.addEventListener('change',e=>{addFiles(e.target.files);fileInput.value=''});
dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('over')});
dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('over'));
dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('over');addFiles(e.dataTransfer.files)});

resetBtn.addEventListener('click',()=>{files=[];renderList();hideStatus();resetBtn.style.display='none'});

mergeBtn.addEventListener('click',async()=>{
  if(files.length<2)return;
  hideStatus();mergeBtn.disabled=true;
  progressWrap.classList.add('visible');progressFill.style.width='0%';
  try{
    const {PDFDocument}=PDFLib;
    const merged=await PDFDocument.create();
    for(let i=0;i<files.length;i++){
      progressLabel.textContent=`Merging file ${i+1} of ${files.length}…`;
      progressFill.style.width=((i/files.length)*90)+'%';
      const buf=await files[i].arrayBuffer();
      let src;
      try{src=await PDFDocument.load(buf)}catch(e){showError(`Cannot read "${files[i].name}" — it may be password-protected.`);mergeBtn.disabled=false;return}
      const pages=await merged.copyPages(src,src.getPageIndices());
      pages.forEach(p=>merged.addPage(p));
    }
    progressLabel.textContent='Finalising…';progressFill.style.width='95%';
    const bytes=await merged.save();
    progressFill.style.width='100%';
    const blob=new Blob([bytes],{type:'application/pdf'});
    dlBtn.href=URL.createObjectURL(blob);
    dlBtn.download='merged.pdf';
    progressWrap.classList.remove('visible');
    successMsg.textContent=`Done! ${merged.getPageCount()} pages · ${fmt(bytes.length)}`;
    statusSuccess.classList.add('visible');dlBtn.classList.add('visible');resetBtn.style.display='block';mergeBtn.disabled=false;
  }catch(e){showError('Error: '+(e.message||'Unknown error'));mergeBtn.disabled=false}
});
</script>
