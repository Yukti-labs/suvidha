<body>
<div class="tool-page">
  <nav class="tool-breadcrumb" aria-label="Breadcrumb">
    <a href="../../index.html">Suvidha</a>
    <span class="crumb-sep">/</span>
    <a href="../../index.html#utility-tools">Career</a>
    <span class="crumb-sep">/</span>
    <span class="crumb-current">Resume Builder</span>
  </nav>

  <header class="tool-header">
    <div class="tool-eyebrow">Career</div>
    <h1>Resume Builder</h1>
    <p class="tool-lead">Fill the fields for a live preview. Everything stays in this browser.</p>
  </header>
  <form class="tool-panel" id="resumeForm">
    <div class="tool-grid">
      <div class="tool-field">
        <label class="tool-label" for="fullName">Full name</label>
        <input type="text" id="fullName" placeholder="Ada Lovelace" required>
      </div>
      <div class="tool-field">
        <label class="tool-label" for="email">Email</label>
        <input type="email" id="email" placeholder="ada@example.com" required>
      </div>
      <div class="tool-field">
        <label class="tool-label" for="phone">Phone</label>
        <input type="tel" id="phone" placeholder="+91 90000 00000">
      </div>
      <div class="tool-field">
        <label class="tool-label" for="title">Title</label>
        <input type="text" id="title" placeholder="Software engineer">
      </div>
    </div>
    <div class="tool-field">
      <label class="tool-label" for="summary">Summary</label>
      <textarea id="summary" rows="3" placeholder="Brief professional summary"></textarea>
    </div>
    <div class="tool-field">
      <label class="tool-label" for="experience">Experience</label>
      <textarea id="experience" rows="4" placeholder="Role at Company — dates"></textarea>
    </div>
    <div class="tool-field">
      <label class="tool-label" for="education">Education</label>
      <textarea id="education" rows="3" placeholder="Degree — Institution — year"></textarea>
    </div>
    <div class="tool-field">
      <label class="tool-label" for="skills">Skills</label>
      <input type="text" id="skills" placeholder="JavaScript, React, SQL">
    </div>
    <div class="tool-actions">
      <button type="submit" class="tool-btn">Update preview</button>
      <button type="button" class="tool-btn tool-btn-ghost" id="printBtn" style="display:none;">Print / Save PDF</button>
      <button type="button" class="tool-btn tool-btn-ghost" id="shareBtn" style="display:none;">Share</button>
    </div>
  </form>
  <div class="preview" id="preview">
    <strong>Live preview</strong>
    <p class="tool-note">Fill the form to see your resume here.</p>
  </div>
  <div id="toolChainWrap" style="display:none; margin-top:20px;"></div>
</div>
<script>
  const form = document.getElementById('resumeForm');
  const preview = document.getElementById('preview');
  const printBtn = document.getElementById('printBtn');
  const shareBtn = document.getElementById('shareBtn');
  const toolChainWrap = document.getElementById('toolChainWrap');

  let currentResumeBlob = null;

  form.addEventListener('submit', e => {
    e.preventDefault();
    const name = document.getElementById('fullName').value;
    const email = document.getElementById('email').value;
    const phone = document.getElementById('phone').value;
    const title = document.getElementById('title').value;
    const summary = document.getElementById('summary').value;
    const experience = document.getElementById('experience').value;
    const education = document.getElementById('education').value;
    const skills = document.getElementById('skills').value;

    preview.innerHTML = `
      <h2>${name || 'Your name'}</h2>
      <div><strong>${title || 'Professional title'}</strong></div>
      <div>${email} · ${phone}</div>
      <hr>
      <h3>Summary</h3>
      <p>${summary || 'Add a professional summary…'}</p>
      <h3>Experience</h3>
      <p>${experience || 'Add work experience…'}</p>
      <h3>Education</h3>
      <p>${education || 'Add education…'}</p>
      <h3>Skills</h3>
      <p>${skills || 'Add skills…'}</p>
    `;

    const resumeHtml = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${name || 'Resume'} - Suvidha</title><style>body{font-family:system-ui,sans-serif;max-width:800px;margin:40px auto;padding:20px;line-height:1.6;}h2{margin-bottom:4px;}hr{margin:16px 0;border:0;border-top:1px solid #ccc;}</style></head><body>${preview.innerHTML}</body></html>`;
    currentResumeBlob = new Blob([resumeHtml], { type: 'text/html;charset=utf-8;' });

    printBtn.style.display = 'inline-flex';
    shareBtn.style.display = 'inline-flex';
    window.suvidhaAnalytics?.toolCompleted('resume-builder');
    window.suvidhaChaining?.render(toolChainWrap, {
      toolSlug: 'resume-builder',
      onReset: () => {
        form.reset();
        preview.innerHTML = '<strong>Live preview</strong><p class="tool-note">Fill the form to see your resume here.</p>';
        currentResumeBlob = null;
        printBtn.style.display = 'none';
        shareBtn.style.display = 'none';
        toolChainWrap.style.display = 'none';
      }
    });
  });

  printBtn.addEventListener('click', () => {
    window.print();
  });

  shareBtn.addEventListener('click', () => {
    if (!currentResumeBlob) return;
    const cleanName = (document.getElementById('fullName').value.trim() || 'resume').replace(/[^a-zA-Z0-9_-]/g, '_');
    window.suvidhaShare?.shareFile(currentResumeBlob, {
      filename: `${cleanName}_resume.html`,
      toolSlug: 'resume-builder',
      action: 'Created resume',
      mime: 'text/html'
    });
  });
</script>
</body>
</html>
