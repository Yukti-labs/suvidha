<body>
<div class="tool-page">
  <nav class="tool-breadcrumb" aria-label="Breadcrumb">
    <a href="../../index.html">Suvidha</a>

  </nav>

  <header class="tool-header">
    <div class="tool-eyebrow">Utility</div>
    <h1>Word Counter</h1>
    <p class="tool-lead">Count words, characters, sentences, and reading time. Nothing is uploaded.</p>
  </header>
  <div class="tool-panel">
    <label class="tool-label" for="textInput">Text</label>
    <textarea id="textInput" placeholder="Paste or type here…"></textarea>
    <div class="stats">
      <div class="stat"><span>Words</span><strong id="words">0</strong></div>
      <div class="stat"><span>Characters</span><strong id="chars">0</strong></div>
      <div class="stat"><span>Sentences</span><strong id="sentences">0</strong></div>
      <div class="stat"><span>Read time</span><strong id="read">0 min</strong></div>
    </div>
  </div>
  <div id="toolChainWrap" style="display:none; margin-top:20px;"></div>
</div>
<script>
const el = document.getElementById('textInput');
const toolChainWrap = document.getElementById('toolChainWrap');

function count() {
  const text = el.value;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  const chars = text.length;
  const sentences = (text.match(/[.!?]+(\s|$)/g) || []).length;
  const minutes = words ? Math.max(1, Math.round(words / 200)) : 0;
  document.getElementById('words').textContent = words;
  document.getElementById('chars').textContent = chars;
  document.getElementById('sentences').textContent = sentences;
  document.getElementById('read').textContent = minutes ? minutes + ' min' : '0 min';

  if (words > 0) {
    window.suvidhaAnalytics?.toolCompleted('word-counter');
    window.suvidhaChaining?.render(toolChainWrap, {
      toolSlug: 'word-counter',
      onReset: () => {
        el.value = '';
        count();
        toolChainWrap.style.display = 'none';
        el.focus();
      }
    });
  } else {
    toolChainWrap.style.display = 'none';
  }
}
el.addEventListener('input', count);
count();
</script>
