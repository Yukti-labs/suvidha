<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Password Generator — Suvidha Tools</title>
<script type="module" src="../../assets/js/shared-ui-new.js"></script>
<style>
  .container { max-width: 500px; }
  .password-display { 
    background: var(--surface2); 
    border: 1px solid var(--border); 
    border-radius: 12px; 
    padding: 20px; 
    margin-bottom: 20px; 
    text-align: center;
    position: relative;
  }
  .password-value { 
    font-family: 'Courier New', monospace; 
    font-size: 1.5rem; 
    word-break: break-all;
    color: var(--text);
    margin-bottom: 12px;
  }
  .password-actions { display: flex; gap: 8px; justify-content: center; }
  .action-btn { 
    padding: 8px 16px; 
    border-radius: 8px; 
    border: 1px solid var(--border); 
    background: var(--surface); 
    color: var(--text); 
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s ease;
  }
  .action-btn:hover { background: var(--surface2); }
  .action-btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
  .action-btn.primary:hover { opacity: 0.9; }
  
  .options { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .option-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .option-row:last-child { margin-bottom: 0; }
  .option-label { font-size: 14px; color: var(--text); }
  .toggle-switch { 
    position: relative; 
    width: 44px; 
    height: 24px; 
    background: var(--surface2); 
    border-radius: 12px; 
    cursor: pointer; 
    transition: background 0.2s ease;
  }
  .toggle-switch.active { background: var(--accent3); }
  .toggle-switch::after { 
    content: ''; 
    position: absolute; 
    width: 20px; 
    height: 20px; 
    background: white; 
    border-radius: 50%; 
    top: 2px; 
    left: 2px; 
    transition: transform 0.2s ease; 
  }
  .toggle-switch.active::after { transform: translateX(20px); }
  
  .length-control { display: flex; align-items: center; gap: 12px; }
  .length-slider { flex: 1; height: 6px; -webkit-appearance: none; appearance: none; background: var(--surface2); border-radius: 3px; outline: none; }
  .length-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; background: var(--accent); border-radius: 50%; cursor: pointer; }
  .length-slider::-moz-range-thumb { width: 18px; height: 18px; background: var(--accent); border-radius: 50%; cursor: pointer; border: none; }
  .length-value { font-family: 'Courier New', monospace; font-size: 16px; color: var(--accent); font-weight: bold; min-width: 30px; text-align: center; }
  
  .strength-meter { height: 4px; background: var(--surface2); border-radius: 2px; margin-top: 12px; overflow: hidden; }
  .strength-fill { height: 100%; width: 0%; transition: width 0.3s ease, background 0.3s ease; }
  .strength-text { font-size: 12px; color: var(--muted); margin-top: 8px; text-align: center; }
  
  .copy-toast { 
    position: fixed; 
    bottom: 20px; 
    left: 50%; 
    transform: translateX(-50%) translateY(100px); 
    background: var(--accent3); 
    color: #0e0e10; 
    padding: 12px 24px; 
    border-radius: 8px; 
    font-size: 14px; 
    font-weight: 600; 
    opacity: 0; 
    transition: all 0.3s ease; 
    z-index: 1000;
  }
  .copy-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  
  .note { font-size: 0.9rem; color: var(--muted); margin-top: 20px; text-align: center; }
</style>
</head>
<body>
<div class="tool-page">
  <div class="header">
    <div class="tool-eyebrow">Utility</div>
    <h1>Password Generator</h1>
    <p class="tool-lead">Generate a random password on this device. Nothing is uploaded.</p>
  </div>
  
  <div class="password-display">
    <div class="password-value" id="passwordValue">Click generate to create password</div>
    <div class="password-actions">
      <button class="action-btn primary" id="generateBtn">Generate</button>
      <button class="action-btn" id="copyBtn">Copy</button>
    </div>
    <div class="strength-meter">
      <div class="strength-fill" id="strengthFill"></div>
    </div>
    <div class="strength-text" id="strengthText"></div>
  </div>
  
  <div class="options">
    <div class="option-row">
      <span class="option-label">Password Length</span>
      <div class="length-control">
        <input type="range" class="length-slider" id="lengthSlider" min="8" max="64" value="16">
        <span class="length-value" id="lengthValue">16</span>
      </div>
    </div>
    <div class="option-row">
      <span class="option-label">Uppercase (A-Z)</span>
      <div class="toggle-switch active" id="uppercaseToggle"></div>
    </div>
    <div class="option-row">
      <span class="option-label">Lowercase (a-z)</span>
      <div class="toggle-switch active" id="lowercaseToggle"></div>
    </div>
    <div class="option-row">
      <span class="option-label">Numbers (0-9)</span>
      <div class="toggle-switch active" id="numbersToggle"></div>
    </div>
    <div class="option-row">
      <span class="option-label">Symbols (!@#$%)</span>
      <div class="toggle-switch active" id="symbolsToggle"></div>
    </div>
  </div>
  
  <p class="tool-note">Generated locally. Nothing is sent to a server.</p>
</div>

<div class="copy-toast" id="copyToast">Password copied to clipboard!</div>

<script>
const passwordValue = document.getElementById('passwordValue');
const generateBtn = document.getElementById('generateBtn');
const copyBtn = document.getElementById('copyBtn');
const lengthSlider = document.getElementById('lengthSlider');
const lengthValue = document.getElementById('lengthValue');
const uppercaseToggle = document.getElementById('uppercaseToggle');
const lowercaseToggle = document.getElementById('lowercaseToggle');
const numbersToggle = document.getElementById('numbersToggle');
const symbolsToggle = document.getElementById('symbolsToggle');
const strengthFill = document.getElementById('strengthFill');
const strengthText = document.getElementById('strengthText');
const copyToast = document.getElementById('copyToast');

const charSets = {
  uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
  lowercase: 'abcdefghijklmnopqrstuvwxyz',
  numbers: '0123456789',
  symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
};

function getEnabledCharSets() {
  let chars = '';
  if (uppercaseToggle.classList.contains('active')) chars += charSets.uppercase;
  if (lowercaseToggle.classList.contains('active')) chars += charSets.lowercase;
  if (numbersToggle.classList.contains('active')) chars += charSets.numbers;
  if (symbolsToggle.classList.contains('active')) chars += charSets.symbols;
  return chars;
}

function generatePassword() {
  const length = parseInt(lengthSlider.value);
  const chars = getEnabledCharSets();
  
  if (chars.length === 0) {
    passwordValue.textContent = 'Enable at least one character type';
    updateStrengthMeter(0);
    return;
  }
  
  let password = '';
  const array = new Uint32Array(length);
  crypto.getRandomValues(array);
  
  for (let i = 0; i < length; i++) {
    password += chars[array[i] % chars.length];
  }
  
  passwordValue.textContent = password;
  updateStrengthMeter(calculateStrength(password));
}

function calculateStrength(password) {
  let strength = 0;
  
  if (password.length >= 8) strength += 20;
  if (password.length >= 12) strength += 20;
  if (password.length >= 16) strength += 10;
  if (/[A-Z]/.test(password)) strength += 10;
  if (/[a-z]/.test(password)) strength += 10;
  if (/[0-9]/.test(password)) strength += 10;
  if (/[^A-Za-z0-9]/.test(password)) strength += 20;
  
  return Math.min(strength, 100);
}

function updateStrengthMeter(strength) {
  strengthFill.style.width = strength + '%';
  
  let color, text;
  if (strength < 30) {
    color = '#ef4444';
    text = 'Weak';
  } else if (strength < 50) {
    color = '#f59e0b';
    text = 'Fair';
  } else if (strength < 70) {
    color = '#eab308';
    text = 'Good';
  } else if (strength < 90) {
    color = '#22c55e';
    text = 'Strong';
  } else {
    color = '#16a34a';
    text = 'Very Strong';
  }
  
  strengthFill.style.background = color;
  strengthText.textContent = strength > 0 ? text : '';
  strengthText.style.color = color;
}

function copyPassword() {
  const password = passwordValue.textContent;
  if (password && password !== 'Click generate to create password' && password !== 'Enable at least one character type') {
    navigator.clipboard.writeText(password).then(() => {
      copyToast.classList.add('show');
      setTimeout(() => copyToast.classList.remove('show'), 2000);
    });
  }
}

// Event listeners
generateBtn.addEventListener('click', generatePassword);
copyBtn.addEventListener('click', copyPassword);

lengthSlider.addEventListener('input', (e) => {
  lengthValue.textContent = e.target.value;
  generatePassword();
});

[uppercaseToggle, lowercaseToggle, numbersToggle, symbolsToggle].forEach(toggle => {
  toggle.addEventListener('click', () => {
    toggle.classList.toggle('active');
    generatePassword();
  });
});

// Generate initial password
generatePassword();
</script>
</body>
</html>
